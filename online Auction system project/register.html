<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - BidderX</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="overflow-x: hidden; min-height: 100vh;">

    <!-- Background Shapes -->
    <div class="hero-bg-shapes" style="position: fixed;">
        <div class="shape shape-1" style="top: -20%; left: -10%;"></div>
        <div class="shape shape-2" style="bottom: -20%; right: -10%;"></div>
        <div class="shape shape-3" style="top: 50%; right: 20%; width: 300px; height: 300px;"></div>
    </div>

    <!-- Back Button -->
    <a href="index.html" class="btn btn-glass" style="position: absolute; top: 2rem; left: 2rem; z-index: 100;">
        <i class="fa-solid fa-arrow-left"></i> Back to Home
    </a>
    
    <!-- Theme Toggle -->
    <button class="btn btn-glass" style="position: absolute; top: 2rem; right: 2rem; z-index: 100;" onclick="document.body.classList.toggle('dark-mode')">
        <i class="fa-solid fa-moon"></i>
    </button>

    <div class="auth-page" style="padding: 5rem 2rem;">
        <div class="glass-card auth-card slide-up" style="max-width: 600px;">
            <div class="auth-header">
                <div class="logo flex-center" style="margin-bottom: 1rem; justify-content: center;">
                    <div class="logo-icon"><i class="fa-solid fa-gem"></i></div>
                    <h2>BidderX</h2>
                </div>
                <h2 class="text-gradient">Create an Account</h2>
                <p>Join the world's premium online auction marketplace.</p>
            </div>

            <form action="index.html">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                    <div class="form-group">
                        <label class="form-label">First Name</label>
                        <input type="text" class="form-control" placeholder="John" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Last Name</label>
                        <input type="text" class="form-control" placeholder="Doe" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-control" placeholder="john@example.com" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Phone Number</label>
                    <input type="tel" class="form-control" placeholder="+1 (555) 000-0000" required>
                </div>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" placeholder="••••••••" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="form-group" style="display: flex; align-items: center; gap: 0.8rem; margin-top: 1rem;">
                    <input type="checkbox" id="seller" style="width: 18px; height: 18px; accent-color: var(--primary);">
                    <label for="seller" style="font-size: 0.9rem; cursor: pointer;">Register as a Seller (Requires Verification)</label>
                </div>
                
                <button type="submit" class="btn btn-primary btn-full" style="margin-top: 1.5rem;">Create Account <i class="fa-solid fa-user-plus"></i></button>
            </form>

            <div class="divider">OR CONTINUE WITH</div>

            <div class="social-login">
                <button class="btn-social">
                    <i class="fa-brands fa-google" style="color: #DB4437;"></i> Google
                </button>
                <button class="btn-social">
                    <i class="fa-brands fa-apple"></i> Apple
                </button>
            </div>

            <div class="auth-footer">
                Already have an account? <a href="login.html">Log In</a>
            </div>
        </div>
    </div>

</body>
</html>
