<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auction - BidderX</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Background Shapes for Glassmorphism -->
    <div class="hero-bg-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <!-- Navigation -->
    <nav class="navbar" id="navbar">
        <div class="container nav-container">
            <a href="/" class="logo">
                <div class="logo-icon"><i class="fa-solid fa-gem"></i></div>
                BidderX
            </a>
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/dashboard">Dashboard</a>
            </div>
            <div class="nav-actions">
                <button class="btn btn-glass" onclick="document.body.classList.toggle('dark-mode')"><i class="fa-solid fa-moon"></i></button>
                <a href="/login" class="btn btn-secondary">Log In</a>
                <a href="/register" class="btn btn-primary">Sign Up</a>
            </div>
        </div>
    </nav>

    <main class="container" style="padding: 8rem 2rem 5rem;">
        <div id="auction-detail"></div>

        <div id="auction-message" class="glass-card" style="display: none; padding: 2rem; text-align: center; color: var(--text-muted);"></div>
    </main>

    <script>
        // Navbar scroll effect - matches the behaviour on the home page.
        window.addEventListener('scroll', () => {
            const navbar = document.getElementById('navbar');
            if (window.scrollY > 50) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        });
    </script>
    <script src="/js/nav-auth.js"></script>
    <script src="/js/live.js"></script>
    <script src="/js/auction.js"></script>
</body>
</html>
