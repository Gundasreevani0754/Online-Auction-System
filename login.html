<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BidderX</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="overflow: hidden;">

    <!-- Background Shapes -->
    <div class="hero-bg-shapes">
        <div class="shape shape-1" style="top: -20%; left: -10%;"></div>
        <div class="shape shape-2" style="bottom: -20%; right: -10%;"></div>
        <div class="shape shape-3" style="top: 30%; right: 40%; width: 200px; height: 200px;"></div>
    </div>

    <!-- Back Button -->
    <a href="index.html" class="btn btn-glass" style="position: absolute; top: 2rem; left: 2rem; z-index: 100;">
        <i class="fa-solid fa-arrow-left"></i> Back to Home
    </a>
    
    <!-- Theme Toggle -->
    <button class="btn btn-glass" style="position: absolute; top: 2rem; right: 2rem; z-index: 100;" onclick="document.body.classList.toggle('dark-mode')">
        <i class="fa-solid fa-moon"></i>
    </button>

    <div class="auth-page">
        <div class="glass-card auth-card slide-up">
            <div class="auth-header">
                <div class="logo flex-center" style="margin-bottom: 1.5rem; justify-content: center;">
                    <div class="logo-icon"><i class="fa-solid fa-gem"></i></div>
                    <h2>BidderX</h2>
                </div>
                <h2 class="text-gradient">Welcome Back</h2>
                <p>Enter your credentials to access your account</p>
            </div>

            <div id="form-error" role="alert" style="display: none; margin-bottom: 1.5rem; padding: 0.8rem 1rem; border-radius: 12px; background: rgba(239, 68, 68, 0.12); border: 1px solid var(--danger); color: var(--danger); font-size: 0.9rem;"></div>

            <form action="/login" method="post">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" name="email" class="form-control" placeholder="john@example.com" required>
                </div>

                <div class="form-group">
                    <div class="flex-between">
                        <label class="form-label">Password</label>
                        <a href="#" style="font-size: 0.8rem; color: var(--primary);">Forgot Password?</a>
                    </div>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="btn btn-primary btn-full">Sign In <i class="fa-solid fa-arrow-right-to-bracket"></i></button>
            </form>

            <div class="divider">OR CONTINUE WITH</div>

            <div class="social-login">
                <button class="btn-social">
                    <i class="fa-brands fa-google" style="color: #DB4437;"></i> Google
                </button>
                <button class="btn-social">
                    <i class="fa-brands fa-apple"></i> Apple
                </button>
            </div>

            <div class="auth-footer">
                Don't have an account? <a href="register.html">Sign Up</a>
            </div>
        </div>
    </div>

    <script src="js/auth-form.js"></script>
</body>
</html>
